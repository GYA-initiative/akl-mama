<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الطلب | أكل ماما</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#A81E24;--bg:#FBFBFB;--line:#e6e6e6;--mute:#6b6b6b}*{box-sizing:border-box;margin:0}
body{background:var(--bg);font-family:Cairo,Tahoma,sans-serif;color:#111;min-height:100vh}
.top{background:#9E2A2B;color:#fff;text-align:center;padding:14px;font-weight:700}
.w{max-width:480px;margin:0 auto;padding:20px 16px 50px}h1{font-size:26px;font-weight:900;color:var(--red);margin:6px 0 4px}
.s{color:var(--mute);font-size:14px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:16px;font:inherit;font-size:19px;background:#fff}
button{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:18px;font:inherit;font-weight:800;font-size:19px;margin-top:16px;cursor:pointer}
.err{color:#c0392b;margin-top:10px;min-height:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
.steps{list-style:none;padding:0;margin:8px 0}
.steps li{display:flex;gap:14px;align-items:center;padding:12px 0;position:relative;color:#aaa;font-weight:700}
.steps li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:17px;top:44px;height:22px;border-inline-start:3px solid #e2e2e2}
.steps i{width:36px;height:36px;border-radius:50%;background:#eee;display:grid;place-items:center;font-style:normal;font-size:18px;flex:none}
.steps li.done{color:#111}.steps li.done i{background:var(--red);color:#fff}
.steps li.cur i{box-shadow:0 0 0 6px #a81e2430;animation:p 1.4s infinite}@keyframes p{50%{box-shadow:0 0 0 12px #a81e2410}}
.steps li.cur{color:var(--red)}
.it{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-top:1px solid var(--line)}
.cx{background:#fdecea;color:#c0392b;border-radius:12px;padding:14px;font-weight:700;text-align:center}
a.b{display:block;text-align:center;color:var(--red);font-weight:700;margin-top:22px;text-decoration:none}
.tg{display:flex;gap:6px;margin:6px 0}.tg button{flex:1;margin:0;padding:11px;background:none;color:#6b6b6b;border:1px solid var(--line);font-size:15px}.tg button.on{background:var(--red);color:#fff;border-color:var(--red)}
.who{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:8px 0}.who a{color:var(--red);font-weight:700;cursor:pointer}
details.cd{margin-top:22px}details.cd summary{cursor:pointer;color:var(--red);font-weight:700;text-align:center}
.ot{font-size:13px;color:#6b6b6b;margin-bottom:4px}
.det{background:#fff7f7;border:1px solid #f0d4d4;border-radius:12px;padding:10px 12px;margin:10px 0;display:grid;gap:6px}.det small{display:block;color:#6b6b6b;font-size:12px}.det b{font-size:16px}
.chat{display:none}.chat.on{display:block}.chat h2{font-size:18px;font-weight:900;margin-bottom:4px}
.cm{height:260px;overflow:auto;background:#faf6f6;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.m{max-width:80%;padding:10px 14px;border-radius:14px;font-size:16px;line-height:1.6;word-break:break-word}.m small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.m.me{align-self:flex-start;background:var(--red);color:#fff}.m.ow{align-self:flex-end;background:#fff;border:1px solid var(--line)}
.cs{display:flex;gap:8px}.cs input{flex:1;font-size:17px;padding:14px}.cs button{width:auto;margin:0;padding:14px 22px;font-size:17px}
.em{color:#999;text-align:center;margin:auto;font-size:15px}
@media (prefers-color-scheme:dark){:root{--bg:#161515;--line:#3a3636}body{color:#f2f2f2}h1{color:#ff6b6b}input{background:#232121;color:#f2f2f2}.card,.m.ow,.who2{background:#232121;color:#f2f2f2}.m.ow{border-color:#3a3636}.cm{background:#1c1a1a}.s,.ot,.det small,.who2{color:#b5b0b0}.det{background:#2a2222;border-color:#4a3030}.steps li{color:#777}.steps i{background:#333}.steps li.done{color:#f2f2f2}.steps li.cur{color:#ff6b6b}.steps li.done i{background:var(--red)}.it{border-color:#3a3636}.tg button{background:none;color:#b5b0b0}.tg button.on{background:var(--red);color:#fff}a.b,.who a,details.cd summary{color:#ff8a8a}.em{color:#888}.cx{background:#3a1f1c}}
</style></head><body><div class="top">أكل ماما</div><div class="w">
<h1>تتبع طلبك</h1>
<p class="s">اكتب كود الطلب ورقم الموبايل اللي طلبت بيه.</p>
<form id="f"><label>كود الطلب</label><input id="c" dir="ltr" autocapitalize="characters" maxlength="12" placeholder="مثال: A1B2C3D4"><label>رقم الموبايل</label><input id="p" type="tel" inputmode="tel" dir="ltr" maxlength="20" placeholder="01xxxxxxxxx"><button>تتبع طلبي</button><div class="err" id="e"></div></form><div id="r"></div>
<div class="card chat" id="chat"><h2>شات مع مطبخ ماما</h2><div class="s" style="margin:0">اكتب سؤالك أو ملاحظتك وهنرد عليك هنا.</div><div class="cm" id="cm"></div><form class="cs" id="cf"><input id="ci" maxlength="500" autocomplete="off" placeholder="اكتب رسالتك"><button>إرسال</button></form><div class="err" id="ce"></div></div>
<a class="b" href="index.html">← الرجوع للمنيو</a></div>
<script>
const SB="https://jedjixrybyxhanaqokre.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZGppeHJ5Ynl4aGFuYXFva3JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MDI4NTYsImV4cCI6MjExMTI3ODg1Nn0.cDuijI1dkCsTh5ycPHUPCugEI1_4xQxCko-uhGBEVJs";
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST=[["new","1","استلمنا طلبك"],["preparing","2","الأكل بيتجهز"],["on_the_way","3","الطلب في الطريق ليك"],["delivered","4","تم التوصيل"]];
function card(o,head){const idx=ST.findIndex(s=>s[0]===o.status);
  let h='<div class="card">'+head;
  if(o.status==="cancelled")h+='<div class="cx" style="margin-top:12px">تم إلغاء الطلب. تواصل معانا لو محتاج مساعدة.</div>';
  else h+='<ul class="steps">'+ST.map((s,i)=>'<li class="'+(i<=idx?"done":"")+(i===idx&&idx<3?" cur":"")+'"><i>'+s[1]+'</i>'+s[2]+'</li>').join("")+'</ul>';
  if(o.phone||o.address)h+='<div class="det"><div><small>الاسم</small><b>'+esc(o.name)+'</b></div><div><small>الموبايل</small><b dir="ltr">'+esc(o.phone||'')+'</b></div><div><small>العنوان</small><b>'+esc(o.address||'')+'</b></div></div>';
  h+='<div style="margin-top:10px">'+o.items.map(i=>'<div class="it"><span>'+esc(i.name)+' × '+i.qty+'</span><b dir="ltr">'+Number(i.price*i.qty).toFixed(2)+'</b></div>').join("")+'<div class="it"><b>الإجمالي</b><b dir="ltr">'+Number(o.total).toFixed(2)+' EGP</b></div></div></div>';return h}
async function go(){
  const code=$("c").value.trim(),phone=$("p").value.trim();$("e").textContent="";
  if(!code||!phone)return;
  try{const r=await fetch(SB+"/rest/v1/rpc/mama_track",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_code:code,p_phone:phone})});
  const a=await r.json();if(!a.length){$("r").innerHTML="";$("e").textContent="مفيش طلب بالبيانات دي. اتأكد من الكود والرقم.";return}
  chatOn(code.toUpperCase().trim(),phone.replace(/\D/g,""));$("r").innerHTML=card(a[0],'<b>أهلاً '+esc(a[0].name)+'</b>');
  }catch(x){$("e").textContent="مشكلة في الاتصال، جرّب تاني."}
}

let CC=null,cn=-1;
async function cget(){if(!CC)return;try{const r=await fetch(SB+"/rest/v1/rpc/mama_chat_get",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_code:CC.c,p_phone:CC.p})});const a=await r.json();if(!Array.isArray(a))return;
 if(a.length===cn)return;cn=a.length;const box=$("cm"),end=box.scrollTop+box.clientHeight>=box.scrollHeight-40||cn===a.length;
 box.innerHTML=a.length?a.map(m=>'<div class="m '+(m.sender==="customer"?"me":"ow")+'">'+esc(m.body)+'<small>'+new Date(m.created_at).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})+'</small></div>').join(""):'<div class="em">مفيش رسائل لسه</div>';box.scrollTop=box.scrollHeight}catch(e){}}
function chatOn(c,p){if(CC&&CC.c===c&&CC.p===p)return;CC={c:c,p:p};cn=-1;$("chat").classList.add("on");cget()}
$("cf").onsubmit=async e=>{e.preventDefault();const b=$("ci").value.trim();if(!b||!CC)return;$("ce").textContent="";$("ci").value="";
 try{const r=await fetch(SB+"/rest/v1/rpc/mama_chat_send",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_code:CC.c,p_phone:CC.p,p_body:b})});const ok=await r.json();if(ok!==true){$("ci").value=b;$("ce").textContent="تعذر الإرسال. جرّب بعد شوية."}cn=-1;cget()}catch(x){$("ci").value=b;$("ce").textContent="مشكلة في الاتصال، جرّب تاني."}};
setInterval(()=>{if(!document.hidden)cget()},6000);
$("f").onsubmit=e=>{e.preventDefault();go()};
const q=new URLSearchParams(location.search);let L=null;try{L=JSON.parse(localStorage.getItem("mama_last")||"null")}catch(e){}
$("c").value=q.get("c")||"";$("p").value=q.get("p")||"";
if(!$("c").value&&L){$("c").value=L.code||"";$("p").value=L.phone||""}
if($("c").value&&$("p").value){go();setInterval(()=>{if(!document.hidden)go()},15000)}
</script></body></html>
